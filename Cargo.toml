[package]
name = "tree-sitter-ats"
description = "Applied Type System"
version = "0.1.0"
authors = ["mage <mageOfStructs@proton.me>"]
license = "GPLv3"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "ats"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://git.dwagon.org/mage/tree-sitter-ats"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
  "/LICENSE",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.26.5"
