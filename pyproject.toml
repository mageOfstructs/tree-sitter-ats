[build-system]
requires = ["setuptools>=62.4.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-ats"
description = "Applied Type System"
version = "0.1.0"
keywords = ["incremental", "parsing", "tree-sitter", "ats"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
authors = [{ name = "mage", email = "mageOfStructs@proton.me" }]
requires-python = ">=3.10"
license.text = "GPLv3"
readme = "README.md"

[project.urls]
Homepage = "https://git.dwagon.org/mage/tree-sitter-ats"
Funding = ""

[project.optional-dependencies]
core = ["tree-sitter~=0.24"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
